name: build
on:
  push:
    branches: [ "cat-toggle" ]
  pull_request:
    branches: [ "cat-toggle" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build with Gradle
        run: ./gradlew --no-daemon clean build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: auto-responser
          path: build/libs/*.jar
